services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dados
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dados"]
      interval: 5s
      timeout: 5s
      retries: 10

  pipeline:
    build: .
    env_file: .env
    environment:
      DB_HOST: postgres   # dentro do compose, o host é o nome do serviço
      DB_PORT: 5432       # porta interna do container
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

volumes:
  pgdata: